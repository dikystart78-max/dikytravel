<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DikyAventura - Travel & Budget Planner</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <!-- Firebase SDKs para Sincronización en Nube -->
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
</head>
<body class="bg-slate-100 font-sans min-h-screen text-slate-800">

  <!-- ENCABEZADO -->
  <header class="bg-indigo-600 text-white shadow-lg sticky top-0 z-50">
    <div class="max-w-6xl mx-auto px-4 py-3 flex justify-between items-center">
      <div class="flex items-center space-x-3 cursor-pointer" onclick="showDashboard()">
        <i class="fa-solid fa-earth-americas text-2xl text-indigo-200"></i>
        <h1 class="text-xl font-bold tracking-wide">DikyAventura</h1>
      </div>
      <button id="btn-main-dashboard" onclick="showDashboard()" class="hidden bg-indigo-700 hover:bg-indigo-800 text-white px-3 py-1.5 rounded-lg text-sm font-medium transition flex items-center gap-2">
        <i class="fa-solid fa-house"></i> Mis Viajes
      </button>
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-4 py-6">

    <!-- VISTA 1: DASHBOARD DE VIAJES -->
    <section id="view-dashboard">
      <div class="flex justify-between items-center mb-6">
        <div>
          <h2 class="text-2xl font-bold text-slate-800">Mis Viajes y Aventuras</h2>
          <p class="text-slate-500 text-sm">Gestiona tus itinerarios, paradas y presupuestos</p>
        </div>
        <button onclick="openTripModal()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-xl text-sm font-semibold shadow-md transition flex items-center gap-2">
          <i class="fa-solid fa-plus"></i> Nuevo Viaje
        </button>
      </div>

      <div id="trips-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
        <!-- Tarjetas de viajes -->
      </div>
    </section>

    <!-- VISTA 2: DETALLE DEL VIAJE -->
    <section id="view-trip-detail" class="hidden space-y-6">
      
      <!-- Ficha resumen del viaje -->
      <div class="bg-white rounded-2xl p-6 shadow-sm border border-slate-200">
        <div class="flex justify-between items-start flex-wrap gap-4">
          <div>
            <span class="text-xs font-semibold uppercase text-indigo-600 bg-indigo-50 px-2.5 py-1 rounded-full">Itinerario de Viaje</span>
            <h2 id="detail-trip-title" class="text-3xl font-extrabold text-slate-800 mt-2">--</h2>
            <p id="detail-trip-desc" class="text-slate-500 mt-1">--</p>
          </div>
          <div class="flex items-center gap-2">
            <button onclick="editCurrentTrip()" class="bg-amber-50 hover:bg-amber-100 text-amber-700 px-3 py-2 rounded-xl text-sm font-medium transition flex items-center gap-1.5">
              <i class="fa-solid fa-pen"></i> Editar Viaje
            </button>
            <button onclick="openStageModal()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded-xl text-sm font-semibold shadow-md transition flex items-center gap-2">
              <i class="fa-solid fa-plus"></i> Nueva Parada
            </button>
            <button onclick="deleteCurrentTrip()" class="bg-rose-50 hover:bg-rose-100 text-rose-600 px-3 py-2 rounded-xl text-sm font-medium transition" title="Eliminar Viaje">
              <i class="fa-solid fa-trash-can"></i>
            </button>
          </div>
        </div>

        <!-- Módulo de Presupuesto del Viaje -->
        <div class="mt-6 pt-6 border-t border-slate-100 grid grid-cols-1 sm:grid-cols-3 gap-4">
          <div class="bg-slate-50 p-4 rounded-xl border border-slate-200">
            <span class="text-xs font-bold text-slate-500 uppercase">Presupuesto Estimado</span>
            <p id="budget-total" class="text-xl font-extrabold text-slate-800 mt-1">$0.00</p>
          </div>
          <div class="bg-slate-50 p-4 rounded-xl border border-slate-200">
            <span class="text-xs font-bold text-slate-500 uppercase">Total Gastado</span>
            <p id="budget-spent" class="text-xl font-extrabold text-rose-600 mt-1">$0.00</p>
          </div>
          <div class="bg-slate-50 p-4 rounded-xl border border-slate-200">
            <span class="text-xs font-bold text-slate-500 uppercase">Disponible / Balance</span>
            <p id="budget-remaining" class="text-xl font-extrabold text-emerald-600 mt-1">$0.00</p>
          </div>
        </div>
      </div>

      <!-- Listado de Paradas / Etapas -->
      <div class="flex items-center justify-between">
        <h3 class="text-lg font-bold text-slate-700">Etapas del Recorrido</h3>
        <span id="stage-count" class="text-xs font-semibold bg-slate-200 text-slate-700 px-2.5 py-1 rounded-full">0 paradas</span>
      </div>

      <div id="stages-container" class="space-y-4">
        <!-- Paradas renderizadas -->
      </div>
    </section>

  </main>

  <!-- MODAL: CREAR / EDITAR VIAJE -->
  <div id="modal-trip" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm hidden flex items-center justify-center z-50 p-4">
    <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-xl">
      <h3 id="modal-trip-title-text" class="text-lg font-bold text-slate-800 mb-4">Nuevo Viaje</h3>
      <form id="form-trip" onsubmit="handleSaveTrip(event)" class="space-y-4">
        <input type="hidden" id="edit-trip-id">
        <div>
          <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Destino / Nombre del Viaje</label>
          <input type="text" id="trip-title" required placeholder="Ej: Estados Unidos" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Descripción corta</label>
          <input type="text" id="trip-desc" placeholder="Ej: Recorrido de Costa a Costa" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Presupuesto Estimado ($ USD)</label>
          <input type="number" id="trip-budget" step="0.01" placeholder="Ej: 5000" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
        </div>
        <div class="flex justify-end space-x-3 pt-2">
          <button type="button" onclick="closeTripModal()" class="px-4 py-2 text-slate-500 text-sm font-medium">Cancelar</button>
          <button type="submit" class="bg-indigo-600 text-white px-4 py-2 rounded-lg text-sm font-semibold shadow">Guardar</button>
        </div>
      </form>
    </div>
  </div>

  <!-- MODAL: CREAR / EDITAR ETAPA -->
  <div id="modal-stage" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm hidden flex items-center justify-center z-50 p-4">
    <div class="bg-white rounded-2xl max-w-lg w-full p-6 shadow-xl max-h-[90vh] overflow-y-auto">
      <h3 id="modal-stage-title-text" class="text-lg font-bold text-slate-800 mb-4">Agregar Parada</h3>
      <form id="form-stage" onsubmit="handleSaveStage(event)" class="space-y-4">
        <input type="hidden" id="edit-stage-id">
        <div>
          <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Ciudad / Punto de Parada</label>
          <input type="text" id="stage-name" required placeholder="Ej: Nueva York, Miami, Chicago..." class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Llegada</label>
            <input type="date" id="stage-date-start" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Salida</label>
            <input type="date" id="stage-date-end" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
          </div>
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Hotel / Dirección Alojamiento</label>
          <input type="text" id="stage-hotel" placeholder="Ej: DoubleTree Times Square" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Puntos de Visita / Atracciones</label>
          <textarea id="stage-places" rows="3" placeholder="Ej: Rockefeller Center, Central Park, Brooklyn Bridge..." class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 outline-none"></textarea>
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Notas / Consejos de Transporte</label>
          <input type="text" id="stage-notes" placeholder="Ej: Tomar Metro Línea N/Q/R en 42 St" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
        </div>
        <div class="flex justify-end space-x-3 pt-2">
          <button type="button" onclick="closeStageModal()" class="px-4 py-2 text-slate-500 text-sm font-medium">Cancelar</button>
          <button type="submit" class="bg-emerald-600 text-white px-4 py-2 rounded-lg text-sm font-semibold shadow">Guardar Parada</button>
        </div>
      </form>
    </div>
  </div>

  <!-- MODAL: AGREGAR GASTO -->
  <div id="modal-expense" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm hidden flex items-center justify-center z-50 p-4">
    <div class="bg-white rounded-2xl max-w-sm w-full p-6 shadow-xl">
      <h3 class="text-lg font-bold text-slate-800 mb-4">Registrar Gasto</h3>
      <form id="form-expense" onsubmit="handleSaveExpense(event)" class="space-y-4">
        <input type="hidden" id="expense-stage-id">
        <div>
          <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Concepto / Detalle</label>
          <input type="text" id="expense-title" required placeholder="Ej: Entradas Rockefeller Center / Cena" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Monto ($ USD)</label>
          <input type="number" id="expense-amount" step="0.01" required placeholder="Ej: 85.00" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
        </div>
        <div class="flex justify-end space-x-3 pt-2">
          <button type="button" onclick="closeExpenseModal()" class="px-4 py-2 text-slate-500 text-sm font-medium">Cancelar</button>
          <button type="submit" class="bg-rose-600 text-white px-4 py-2 rounded-lg text-sm font-semibold shadow">Registrar Gasto</button>
        </div>
      </form>
    </div>
  </div>

  <!-- JAVASCRIPT & APP LOGIC -->
  <script>
    // Inicialización del Estado
    let trips = JSON.parse(localStorage.getItem('diky_trips_v2')) || [
      {
        id: '1',
        title: 'Estados Unidos',
        desc: 'Aventura Costa a Costa',
        budget: 4500,
        stages: [
          { 
            id: 's1', 
            name: 'Miami', 
            dateStart: '2026-08-16', 
            dateEnd: '2026-08-17', 
            hotel: 'Lo de Tati', 
            places: 'Key West, South Beach, Bayside Marketplace', 
            notes: 'Salida en tren Amtrak hacia Nueva York',
            expenses: [{ id: 'e1', title: 'Tren Amtrak', amount: 140 }]
          },
          { 
            id: 's2', 
            name: 'Nueva York', 
            dateStart: '2026-08-18', 
            dateEnd: '2026-08-21', 
            hotel: 'DoubleTree by Hilton Times Square South', 
            places: 'Rockefeller Center, Central Park, Brooklyn Bridge, Times Square', 
            notes: 'Comprar MetroCard ilimitada de 7 días',
            expenses: [{ id: 'e2', title: 'Hotel Reserva', amount: 650 }, { id: 'e3', title: 'Pase de Atracciones', amount: 180 }]
          }
        ]
      }
    ];

    let currentTripId = null;

    function saveToStorage() {
      localStorage.setItem('diky_trips_v2', JSON.stringify(trips));
    }

    // Navegación
    function showDashboard() {
      currentTripId = null;
      document.getElementById('view-dashboard').classList.remove('hidden');
      document.getElementById('view-trip-detail').classList.add('hidden');
      document.getElementById('btn-main-dashboard').classList.add('hidden');
      renderTrips();
    }

    function showTripDetail(tripId) {
      currentTripId = tripId;
      document.getElementById('view-dashboard').classList.add('hidden');
      document.getElementById('view-trip-detail').classList.remove('hidden');
      document.getElementById('btn-main-dashboard').classList.remove('hidden');
      renderTripDetail();
    }

    // Renderizar Lista de Viajes
    function renderTrips() {
      const container = document.getElementById('trips-container');
      container.innerHTML = '';

      if (trips.length === 0) {
        container.innerHTML = `<div class="col-span-full text-center py-12 text-slate-400">No hay viajes guardados. ¡Crea uno nuevo!</div>`;
        return;
      }

      trips.forEach((trip) => {
        const totalSpent = trip.stages.reduce((acc, s) => acc + (s.expenses ? s.expenses.reduce((ea, e) => ea + parseFloat(e.amount || 0), 0) : 0), 0);
        
        const card = document.createElement('div');
        card.className = "bg-white rounded-2xl p-5 shadow-sm border border-slate-200 hover:shadow-md transition flex flex-col justify-between";
        card.innerHTML = `
          <div>
            <div class="flex items-center justify-between mb-2">
              <span class="text-xs font-bold text-indigo-600 bg-indigo-50 px-2 py-0.5 rounded"><i class="fa-solid fa-map-pin"></i> ${trip.stages.length} Paradas</span>
              <span class="text-xs font-semibold text-slate-500">Gastado: $${totalSpent.toFixed(2)}</span>
            </div>
            <h3 class="text-xl font-bold text-slate-800">${trip.title}</h3>
            <p class="text-slate-500 text-sm mt-1 mb-4">${trip.desc || 'Sin descripción'}</p>
          </div>
          <div class="flex gap-2">
            <button onclick="showTripDetail('${trip.id}')" class="flex-1 bg-slate-900 hover:bg-indigo-600 text-white font-medium py-2 rounded-xl text-sm transition flex items-center justify-center gap-2">
              Ver Detalle <i class="fa-solid fa-arrow-right text-xs"></i>
            </button>
            <button onclick="openTripModal('${trip.id}')" class="bg-slate-100 hover:bg-amber-100 text-slate-600 hover:text-amber-700 px-3 py-2 rounded-xl text-sm transition" title="Editar Viaje">
              <i class="fa-solid fa-pen"></i>
            </button>
          </div>
        `;
        container.appendChild(card);
      });
    }

    // Renderizar Detalle de Viaje y Gastos
    function renderTripDetail() {
      const trip = trips.find(t => t.id === currentTripId);
      if (!trip) return showDashboard();

      document.getElementById('detail-trip-title').innerText = trip.title;
      document.getElementById('detail-trip-desc').innerText = trip.desc || 'Sin descripción';
      document.getElementById('stage-count').innerText = `${trip.stages.length} paradas`;

      // CÁLCULO DE PRESUPUESTO
      const budget = parseFloat(trip.budget || 0);
      let totalSpent = 0;
      trip.stages.forEach(s => {
        if (s.expenses) {
          s.expenses.forEach(e => totalSpent += parseFloat(e.amount || 0));
        }
      });
      const remaining = budget - totalSpent;

      document.getElementById('budget-total').innerText = `$${budget.toFixed(2)}`;
      document.getElementById('budget-spent').innerText = `$${totalSpent.toFixed(2)}`;
      document.getElementById('budget-remaining').innerText = `$${remaining.toFixed(2)}`;
      document.getElementById('budget-remaining').className = `text-xl font-extrabold mt-1 ${remaining < 0 ? 'text-rose-600' : 'text-emerald-600'}`;

      // RENDERIZAR ETAPAS
      const container = document.getElementById('stages-container');
      container.innerHTML = '';

      if (trip.stages.length === 0) {
        container.innerHTML = `<div class="text-center py-10 bg-white rounded-2xl border border-dashed text-slate-400">Aún no agregaste paradas a este viaje.</div>`;
        return;
      }

      trip.stages.forEach((stage, idx) => {
        const mapsQuery = encodeURIComponent(`${stage.name} ${stage.hotel || ''}`);
        const restaurantQuery = encodeURIComponent(`Restaurantes cerca de ${stage.name}`);
        const metroQuery = encodeURIComponent(`Estación de metro cerca de ${stage.name}`);

        const stageExpensesTotal = stage.expenses ? stage.expenses.reduce((sum, e) => sum + parseFloat(e.amount || 0), 0) : 0;

        const item = document.createElement('div');
        item.className = "bg-white rounded-2xl p-5 shadow-sm border border-slate-200 space-y-4";
        item.innerHTML = `
          <div class="flex justify-between items-start flex-wrap gap-2">
            <div class="flex items-center gap-2">
              <span class="w-7 h-7 rounded-full bg-indigo-600 text-white text-xs font-bold flex items-center justify-center">${idx + 1}</span>
              <h4 class="text-xl font-bold text-slate-800">${stage.name}</h4>
              ${stage.dateStart ? `<span class="text-xs bg-slate-100 text-slate-600 px-2.5 py-1 rounded-full"><i class="fa-regular fa-calendar"></i> ${stage.dateStart} ${stage.dateEnd ? ' al ' + stage.dateEnd : ''}</span>` : ''}
            </div>
            
            <div class="flex items-center gap-2">
              <button onclick="openStageModal('${stage.id}')" class="text-xs bg-amber-50 text-amber-700 hover:bg-amber-100 px-2.5 py-1.5 rounded-lg font-medium transition flex items-center gap-1">
                <i class="fa-solid fa-pen"></i> Editar
              </button>
              <button onclick="deleteStage('${stage.id}')" class="text-xs bg-rose-50 text-rose-600 hover:bg-rose-100 px-2.5 py-1.5 rounded-lg font-medium transition" title="Borrar etapa">
                <i class="fa-solid fa-trash-can"></i>
              </button>
            </div>
          </div>

          <div class="grid grid-cols-1 md:grid-cols-2 gap-4 text-sm text-slate-600">
            <div class="space-y-2">
              ${stage.hotel ? `<p><i class="fa-solid fa-hotel text-indigo-500 w-5"></i> <strong>Alojamiento:</strong> ${stage.hotel}</p>` : ''}
              ${stage.places ? `<p><i class="fa-solid fa-map-location-dot text-rose-500 w-5"></i> <strong>Atracciones:</strong> ${stage.places}</p>` : ''}
              ${stage.notes ? `<p class="italic text-slate-500"><i class="fa-solid fa-note-sticky text-amber-500 w-5"></i> ${stage.notes}</p>` : ''}
            </div>

            <!-- Accesos a Google Maps e Inteligencia Local -->
            <div class="bg-slate-50 p-3 rounded-xl border border-slate-100 space-y-2">
              <span class="text-xs font-bold text-slate-500 uppercase block mb-1"><i class="fa-solid fa-compass text-indigo-600"></i> Explorar & Google Maps</span>
              <div class="flex flex-wrap gap-2">
                <a href="https://www.google.com/maps/search/?api=1&query=${mapsQuery}" target="_blank" class="text-xs bg-white border border-slate-200 hover:bg-indigo-50 hover:text-indigo-600 px-2.5 py-1 rounded-lg transition font-medium flex items-center gap-1">
                  <i class="fa-solid fa-map-pin text-rose-500"></i> Ver en Maps
                </a>
                <a href="https://www.google.com/maps/search/?api=1&query=${restaurantQuery}" target="_blank" class="text-xs bg-white border border-slate-200 hover:bg-indigo-50 hover:text-indigo-600 px-2.5 py-1 rounded-lg transition font-medium flex items-center gap-1">
                  <i class="fa-solid fa-utensils text-emerald-500"></i> Restaurantes
                </a>
                <a href="https://www.google.com/maps/search/?api=1&query=${metroQuery}" target="_blank" class="text-xs bg-white border border-slate-200 hover:bg-indigo-50 hover:text-indigo-600 px-2.5 py-1 rounded-lg transition font-medium flex items-center gap-1">
                  <i class="fa-solid fa-train-subway text-indigo-500"></i> Metro / Bus
                </a>
              </div>
            </div>
          </div>

          <!-- Módulo de Gastos de la Parada -->
          <div class="pt-3 border-t border-slate-100 flex justify-between items-center flex-wrap gap-2">
            <div class="flex items-center gap-2">
              <span class="text-xs font-bold text-slate-500">Gastos en esta parada:</span>
              <span class="text-xs font-extrabold text-slate-800">$${stageExpensesTotal.toFixed(2)}</span>
            </div>
            <button onclick="openExpenseModal('${stage.id}')" class="text-xs bg-emerald-50 text-emerald-700 hover:bg-emerald-100 px-2.5 py-1.5 rounded-lg font-semibold transition flex items-center gap-1">
              <i class="fa-solid fa-plus"></i> Cargar Gasto
            </button>
          </div>
        `;
        container.appendChild(item);
      });
    }

    // GESTIÓN DE VIAJES (Crear / Editar)
    function openTripModal(tripId = null) {
      document.getElementById('modal-trip').classList.remove('hidden');
      if (tripId) {
        const trip = trips.find(t => t.id === tripId);
        document.getElementById('modal-trip-title-text').innerText = "Editar Viaje";
        document.getElementById('edit-trip-id').value = trip.id;
        document.getElementById('trip-title').value = trip.title;
        document.getElementById('trip-desc').value = trip.desc || '';
        document.getElementById('trip-budget').value = trip.budget || '';
      } else {
        document.getElementById('modal-trip-title-text').innerText = "Nuevo Viaje";
        document.getElementById('form-trip').reset();
        document.getElementById('edit-trip-id').value = '';
      }
    }
    function closeTripModal() { document.getElementById('modal-trip').classList.add('hidden'); }

    function handleSaveTrip(e) {
      e.preventDefault();
      const editId = document.getElementById('edit-trip-id').value;
      const title = document.getElementById('trip-title').value;
      const desc = document.getElementById('trip-desc').value;
      const budget = parseFloat(document.getElementById('trip-budget').value || 0);

      if (editId) {
        const trip = trips.find(t => t.id === editId);
        if (trip) {
          trip.title = title;
          trip.desc = desc;
          trip.budget = budget;
        }
      } else {
        trips.push({ id: Date.now().toString(), title, desc, budget, stages: [] });
      }

      saveToStorage();
      closeTripModal();
      if (currentTripId) renderTripDetail(); else renderTrips();
    }

    function editCurrentTrip() { openTripModal(currentTripId); }

    function deleteCurrentTrip() {
      if (confirm('¿Eliminar este viaje y todas sus etapas?')) {
        trips = trips.filter(t => t.id !== currentTripId);
        saveToStorage();
        showDashboard();
      }
    }

    // GESTIÓN DE ETAPAS (Crear / Editar)
    function openStageModal(stageId = null) {
      document.getElementById('modal-stage').classList.remove('hidden');
      const trip = trips.find(t => t.id === currentTripId);

      if (stageId && trip) {
        const stage = trip.stages.find(s => s.id === stageId);
        document.getElementById('modal-stage-title-text').innerText = "Editar Parada";
        document.getElementById('edit-stage-id').value = stage.id;
        document.getElementById('stage-name').value = stage.name;
        document.getElementById('stage-date-start').value = stage.dateStart || '';
        document.getElementById('stage-date-end').value = stage.dateEnd || '';
        document.getElementById('stage-hotel').value = stage.hotel || '';
        document.getElementById('stage-places').value = stage.places || '';
        document.getElementById('stage-notes').value = stage.notes || '';
      } else {
        document.getElementById('modal-stage-title-text').innerText = "Agregar Nueva Parada";
        document.getElementById('form-stage').reset();
        document.getElementById('edit-stage-id').value = '';
      }
    }
    function closeStageModal() { document.getElementById('modal-stage').classList.add('hidden'); }

    function handleSaveStage(e) {
      e.preventDefault();
      const trip = trips.find(t => t.id === currentTripId);
      if (!trip) return;

      const editStageId = document.getElementById('edit-stage-id').value;
      const stageData = {
        name: document.getElementById('stage-name').value,
        dateStart: document.getElementById('stage-date-start').value,
        dateEnd: document.getElementById('stage-date-end').value,
        hotel: document.getElementById('stage-hotel').value,
        places: document.getElementById('stage-places').value,
        notes: document.getElementById('stage-notes').value
      };

      if (editStageId) {
        const stage = trip.stages.find(s => s.id === editStageId);
        if (stage) Object.assign(stage, stageData);
      } else {
        trip.stages.push({ id: Date.now().toString(), ...stageData, expenses: [] });
      }

      saveToStorage();
      closeStageModal();
      renderTripDetail();
    }

    function deleteStage(stageId) {
      const trip = trips.find(t => t.id === currentTripId);
      if (trip && confirm('¿Eliminar esta parada?')) {
        trip.stages = trip.stages.filter(s => s.id !== stageId);
        saveToStorage();
        renderTripDetail();
      }
    }

    // GESTIÓN DE GASTOS
    function openExpenseModal(stageId) {
      document.getElementById('modal-expense').classList.remove('hidden');
      document.getElementById('expense-stage-id').value = stageId;
      document.getElementById('form-expense').reset();
    }
    function closeExpenseModal() { document.getElementById('modal-expense').classList.add('hidden'); }

    function handleSaveExpense(e) {
      e.preventDefault();
      const stageId = document.getElementById('expense-stage-id').value;
      const trip = trips.find(t => t.id === currentTripId);
      if (!trip) return;

      const stage = trip.stages.find(s => s.id === stageId);
      if (stage) {
        if (!stage.expenses) stage.expenses = [];
        stage.expenses.push({
          id: Date.now().toString(),
          title: document.getElementById('expense-title').value,
          amount: parseFloat(document.getElementById('expense-amount').value || 0)
        });
        saveToStorage();
        closeExpenseModal();
        renderTripDetail();
      }
    }

    // Inicialización
    renderTrips();
  </script>
</body>
</html>
