<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mis Viajes & Aventuras</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-100 font-sans min-h-screen">

  <!-- ENCABEZADO -->
  <header class="bg-indigo-600 text-white shadow-lg sticky top-0 z-50">
    <div class="max-w-5xl mx-auto px-4 py-4 flex justify-between items-center">
      <div class="flex items-center space-x-2">
        <i class="fa-solid fa-plane-departure text-2xl"></i>
        <h1 class="text-xl font-bold tracking-wide">DikyAventura Planner</h1>
      </div>
      <button id="btn-main-dashboard" onclick="showDashboard()" class="hidden bg-indigo-700 hover:bg-indigo-800 text-white px-3 py-1.5 rounded-lg text-sm font-medium transition flex items-center gap-2">
        <i class="fa-solid fa-house"></i> Mis Viajes
      </button>
    </div>
  </header>

  <main class="max-w-5xl mx-auto px-4 py-6">

    <!-- VISTA 1: DASHBOARD DE VIAJES -->
    <section id="view-dashboard">
      <div class="flex justify-between items-center mb-6">
        <div>
          <h2 class="text-2xl font-bold text-slate-800">Mis Viajes</h2>
          <p class="text-slate-500 text-sm">Gestiona tus aventuras y planifica cada parada</p>
        </div>
        <button onclick="openTripModal()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-xl text-sm font-semibold shadow-md transition flex items-center gap-2">
          <i class="fa-solid fa-plus"></i> Nuevo Viaje
        </button>
      </div>

      <!-- Lista de viajes (Tarjetas) -->
      <div id="trips-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
        <!-- Se genera dinámicamente -->
      </div>
    </section>

    <!-- VISTA 2: DETALLE DEL VIAJE SELECCIONADO -->
    <section id="view-trip-detail" class="hidden">
      <!-- Info Header Viaje -->
      <div class="bg-white rounded-2xl p-6 shadow-sm border border-slate-200 mb-6">
        <div class="flex justify-between items-start flex-wrap gap-4">
          <div>
            <span class="text-xs font-semibold uppercase text-indigo-600 bg-indigo-50 px-2.5 py-1 rounded-full">Itinerario Activo</span>
            <h2 id="detail-trip-title" class="text-3xl font-extrabold text-slate-800 mt-2">--</h2>
            <p id="detail-trip-desc" class="text-slate-500 mt-1">--</p>
          </div>
          <div class="flex gap-2">
            <button onclick="openStageModal()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded-xl text-sm font-semibold shadow-md transition flex items-center gap-2">
              <i class="fa-solid fa-plus"></i> Nueva Parada / Etapa
            </button>
            <button onclick="deleteCurrentTrip()" class="bg-rose-50 hover:bg-rose-100 text-rose-600 px-3 py-2 rounded-xl text-sm font-medium transition" title="Eliminar Viaje">
              <i class="fa-solid fa-trash-can"></i>
            </button>
          </div>
        </div>
      </div>

      <!-- Paradas / Etapas -->
      <div class="flex items-center justify-between mb-4">
        <h3 class="text-lg font-bold text-slate-700">Etapas y Paradas del Viaje</h3>
        <span id="stage-count" class="text-xs font-semibold bg-slate-200 text-slate-700 px-2.5 py-1 rounded-full">0 paradas</span>
      </div>

      <div id="stages-container" class="space-y-4">
        <!-- Se genera dinámicamente -->
      </div>
    </section>

  </main>

  <!-- MODAL: CREAR VIAJE -->
  <div id="modal-trip" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm hidden flex items-center justify-center z-50 p-4">
    <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-xl">
      <h3 class="text-lg font-bold text-slate-800 mb-4">Agregar Nuevo Viaje</h3>
      <form id="form-trip" onsubmit="handleSaveTrip(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Destino / Nombre del Viaje</label>
          <input type="text" id="trip-title" required placeholder="Ej: Estados Unidos 2026" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Descripción corta</label>
          <input type="text" id="trip-desc" placeholder="Ej: Recorrido de Costa a Costa" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
        </div>
        <div class="flex justify-end space-x-3 pt-2">
          <button type="button" onclick="closeTripModal()" class="px-4 py-2 text-slate-500 text-sm font-medium">Cancelar</button>
          <button type="submit" class="bg-indigo-600 text-white px-4 py-2 rounded-lg text-sm font-semibold shadow">Guardar Viaje</button>
        </div>
      </form>
    </div>
  </div>

  <!-- MODAL: CREAR PARADA / ETAPA -->
  <div id="modal-stage" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm hidden flex items-center justify-center z-50 p-4">
    <div class="bg-white rounded-2xl max-w-lg w-full p-6 shadow-xl max-h-[90vh] overflow-y-auto">
      <h3 class="text-lg font-bold text-slate-800 mb-4">Agregar Nueva Etapa / Parada</h3>
      <form id="form-stage" onsubmit="handleSaveStage(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Ciudad / Nombre de la Etapa</label>
          <input type="text" id="stage-name" required placeholder="Ej: Miami, Nueva York, Chicago..." class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Fecha Llegada / Inicio</label>
            <input type="date" id="stage-date-start" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Fecha Salida / Fin</label>
            <input type="date" id="stage-date-end" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
          </div>
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Hotel / Alojamiento</label>
          <input type="text" id="stage-hotel" placeholder="Nombre del hotel o dirección" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Puntos de Visita / Actividades</label>
          <textarea id="stage-places" rows="3" placeholder="Ej: Times Square, Central Park, Statue of Liberty..." class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 outline-none"></textarea>
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Notas adicionales / Transporte</label>
          <input type="text" id="stage-notes" placeholder="Ej: Vuelo con Delta / Tren Amtrak a las 10:00 AM" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
        </div>
        <div class="flex justify-end space-x-3 pt-2">
          <button type="button" onclick="closeStageModal()" class="px-4 py-2 text-slate-500 text-sm font-medium">Cancelar</button>
          <button type="submit" class="bg-emerald-600 text-white px-4 py-2 rounded-lg text-sm font-semibold shadow">Agregar Etapa</button>
        </div>
      </form>
    </div>
  </div>

  <!-- JAVASCRIPT LOGIC -->
  <script>
    // Estado global en localStorage
    let trips = JSON.parse(localStorage.getItem('diky_trips')) || [
      {
        id: '1',
        title: 'Estados Unidos',
        desc: 'Recorrido por las principales ciudades',
        stages: [
          { id: 's1', name: 'Miami', dateStart: '2026-08-16', dateEnd: '2026-08-17', hotel: 'Lo de Tati', places: 'Key West, South Beach', notes: 'Salida en tren Amtrak hacia NY' },
          { id: 's2', name: 'Nueva York', dateStart: '2026-08-18', dateEnd: '2026-08-21', hotel: 'DoubleTree by Hilton Times Square South', places: 'Hudson Yards, High Line, Times Square, Estatua de la Libertad', notes: 'Llegada a NY Penn Station' }
        ]
      }
    ];

    let currentTripId = null;

    function saveToStorage() {
      localStorage.setItem('diky_trips', JSON.stringify(trips));
    }

    // Navegación
    function showDashboard() {
      currentTripId = null;
      document.getElementById('view-dashboard').classList.remove('hidden');
      document.getElementById('view-trip-detail').classList.add('hidden');
      document.getElementById('btn-main-dashboard').classList.add('hidden');
      renderTrips();
    }

    function showTripDetail(tripId) {
      currentTripId = tripId;
      document.getElementById('view-dashboard').classList.add('hidden');
      document.getElementById('view-trip-detail').classList.remove('hidden');
      document.getElementById('btn-main-dashboard').classList.remove('hidden');
      renderTripDetail();
    }

    // Renderizar Trips
    function renderTrips() {
      const container = document.getElementById('trips-container');
      container.innerHTML = '';

      if (trips.length === 0) {
        container.innerHTML = `<div class="col-span-full text-center py-12 text-slate-400">No tienes viajes guardados. ¡Crea el primero!</div>`;
        return;
      }

      trips.forEach((trip, index) => {
        const card = document.createElement('div');
        card.className = "bg-white rounded-2xl p-5 shadow-sm border border-slate-200 hover:shadow-md transition flex flex-col justify-between";
        card.innerHTML = `
          <div>
            <div class="flex items-center justify-between mb-2">
              <span class="text-xs font-bold text-indigo-600 bg-indigo-50 px-2 py-0.5 rounded">Viaje #${index + 1}</span>
              <span class="text-xs text-slate-400"><i class="fa-solid fa-location-dot"></i> ${trip.stages.length} Paradas</span>
            </div>
            <h3 class="text-xl font-bold text-slate-800">${trip.title}</h3>
            <p class="text-slate-500 text-sm mt-1 mb-4">${trip.desc || 'Sin descripción'}</p>
          </div>
          <button onclick="showTripDetail('${trip.id}')" class="w-full bg-slate-900 hover:bg-indigo-600 text-white font-medium py-2 rounded-xl text-sm transition flex items-center justify-center gap-2">
            Ver Itinerario <i class="fa-solid fa-arrow-right text-xs"></i>
          </button>
        `;
        container.appendChild(card);
      });
    }

    // Renderizar Detalle de Viaje
    function renderTripDetail() {
      const trip = trips.find(t => t.id === currentTripId);
      if (!trip) return showDashboard();

      document.getElementById('detail-trip-title').innerText = trip.title;
      document.getElementById('detail-trip-desc').innerText = trip.desc || '';
      document.getElementById('stage-count').innerText = `${trip.stages.length} paradas`;

      const container = document.getElementById('stages-container');
      container.innerHTML = '';

      if (trip.stages.length === 0) {
        container.innerHTML = `<div class="text-center py-10 bg-white rounded-2xl border border-dashed text-slate-400">Aún no hay paradas en este viaje. Agrega la primera arriba.</div>`;
        return;
      }

      trip.stages.forEach((stage, idx) => {
        const item = document.createElement('div');
        item.className = "bg-white rounded-2xl p-5 shadow-sm border border-slate-200 flex flex-col md:flex-row gap-4 justify-between items-start";
        item.innerHTML = `
          <div class="space-y-2 flex-1">
            <div class="flex items-center gap-2">
              <span class="w-6 h-6 rounded-full bg-indigo-600 text-white text-xs font-bold flex items-center justify-center">${idx + 1}</span>
              <h4 class="text-lg font-bold text-slate-800">${stage.name}</h4>
              ${stage.dateStart ? `<span class="text-xs bg-slate-100 text-slate-600 px-2 py-0.5 rounded ml-2"><i class="fa-regular fa-calendar"></i> ${stage.dateStart} ${stage.dateEnd ? ' al ' + stage.dateEnd : ''}</span>` : ''}
            </div>
            
            ${stage.hotel ? `<p class="text-sm text-slate-600"><i class="fa-solid fa-hotel text-indigo-500 w-5"></i> <strong>Hotel:</strong> ${stage.hotel}</p>` : ''}
            ${stage.places ? `<p class="text-sm text-slate-600"><i class="fa-solid fa-map-pin text-rose-500 w-5"></i> <strong>Atracciones:</strong> ${stage.places}</p>` : ''}
            ${stage.notes ? `<p class="text-sm text-slate-500 italic"><i class="fa-solid fa-note-sticky text-amber-500 w-5"></i> ${stage.notes}</p>` : ''}
          </div>
          <button onclick="deleteStage('${stage.id}')" class="text-slate-300 hover:text-rose-500 transition p-1" title="Borrar parada">
            <i class="fa-solid fa-trash-can"></i>
          </button>
        `;
        container.appendChild(item);
      });
    }

    // Modal Viajes
    function openTripModal() { document.getElementById('modal-trip').classList.remove('hidden'); }
    function closeTripModal() { document.getElementById('modal-trip').classList.add('hidden'); }
    function handleSaveTrip(e) {
      e.preventDefault();
      const title = document.getElementById('trip-title').value;
      const desc = document.getElementById('trip-desc').value;
      const newTrip = { id: Date.now().toString(), title, desc, stages: [] };
      trips.push(newTrip);
      saveToStorage();
      closeTripModal();
      document.getElementById('form-trip').reset();
      renderTrips();
    }

    function deleteCurrentTrip() {
      if (confirm('¿Eliminar este viaje y todas sus etapas?')) {
        trips = trips.filter(t => t.id !== currentTripId);
        saveToStorage();
        showDashboard();
      }
    }

    // Modal Etapas
    function openStageModal() { document.getElementById('modal-stage').classList.remove('hidden'); }
    function closeStageModal() { document.getElementById('modal-stage').classList.add('hidden'); }
    function handleSaveStage(e) {
      e.preventDefault();
      const trip = trips.find(t => t.id === currentTripId);
      if (!trip) return;

      const newStage = {
        id: Date.now().toString(),
        name: document.getElementById('stage-name').value,
        dateStart: document.getElementById('stage-date-start').value,
        dateEnd: document.getElementById('stage-date-end').value,
        hotel: document.getElementById('stage-hotel').value,
        places: document.getElementById('stage-places').value,
        notes: document.getElementById('stage-notes').value
      };

      trip.stages.push(newStage);
      saveToStorage();
      closeStageModal();
      document.getElementById('form-stage').reset();
      renderTripDetail();
    }

    function deleteStage(stageId) {
      const trip = trips.find(t => t.id === currentTripId);
      if (trip) {
        trip.stages = trip.stages.filter(s => s.id !== stageId);
        saveToStorage();
        renderTripDetail();
      }
    }

    // Inicializar
    renderTrips();
  </script>
</body>
</html>
