<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>DikyAventura - Travel & Budget Planner</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <!-- Firebase SDKs para Sincronización en Nube -->
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
  <style>
    /* Estilos App Nativa */
    body {
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    input, textarea, button {
      user-select: text;
    }
  </style>
</head>
<body class="bg-slate-100 font-sans min-h-screen text-slate-800 pb-12">

  <!-- ENCABEZADO ESTILO APP -->
  <header class="bg-indigo-600 text-white shadow-md sticky top-0 z-40 backdrop-blur-md bg-opacity-95">
    <div class="max-w-4xl mx-auto px-4 py-3 flex justify-between items-center">
      <div class="flex items-center space-x-3 cursor-pointer" onclick="showDashboard()">
        <div class="w-9 h-9 rounded-xl bg-indigo-500/30 flex items-center justify-center border border-indigo-400/30">
          <i class="fa-solid fa-earth-americas text-xl text-indigo-200"></i>
        </div>
        <div>
          <h1 class="text-lg font-bold leading-none">DikyAventura</h1>
          <p class="text-[10px] text-indigo-200 font-medium">Travel & Expense Planner</p>
        </div>
      </div>
      <button id="btn-main-dashboard" onclick="showDashboard()" class="hidden bg-indigo-700/80 hover:bg-indigo-700 text-white px-3 py-1.5 rounded-xl text-xs font-semibold transition flex items-center gap-1.5 border border-indigo-500/30">
        <i class="fa-solid fa-house"></i> Mis Viajes
      </button>
    </div>
  </header>

  <main class="max-w-4xl mx-auto px-4 py-5">

    <!-- VISTA 1: DASHBOARD DE VIAJES -->
    <section id="view-dashboard" class="space-y-4">
      <div class="flex justify-between items-center">
        <div>
          <h2 class="text-xl font-extrabold text-slate-800">Mis Mis viajes</h2>
          <p class="text-xs text-slate-500">Planifica itinerarios y controla tus gastos</p>
        </div>
        <button onclick="openTripModal()" class="bg-indigo-600 hover:bg-indigo-700 active:scale-95 text-white px-3.5 py-2 rounded-xl text-xs font-bold shadow-md transition flex items-center gap-1.5">
          <i class="fa-solid fa-plus text-xs"></i> Nuevo Viaje
        </button>
      </div>

      <div id="trips-container" class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <!-- Tarjetas de viajes -->
      </div>
    </section>

    <!-- VISTA 2: DETALLE DEL VIAJE -->
    <section id="view-trip-detail" class="hidden space-y-5">
      
      <!-- Ficha resumen del viaje -->
      <div class="bg-white rounded-2xl p-5 shadow-sm border border-slate-200/80 relative overflow-hidden">
        <div class="flex justify-between items-start gap-2">
          <div>
            <span class="text-[10px] font-bold uppercase tracking-wider text-indigo-600 bg-indigo-50 px-2.5 py-1 rounded-full border border-indigo-100">Itinerario Activo</span>
            <h2 id="detail-trip-title" class="text-2xl font-black text-slate-800 mt-1.5">--</h2>
            <p id="detail-trip-desc" class="text-xs text-slate-500 mt-0.5">--</p>
          </div>
          <div class="flex items-center gap-1.5">
            <button onclick="editCurrentTrip()" class="bg-amber-50 hover:bg-amber-100 text-amber-700 p-2 rounded-xl text-xs font-medium transition" title="Editar datos del viaje">
              <i class="fa-solid fa-pen"></i>
            </button>
            <button onclick="deleteCurrentTrip()" class="bg-rose-50 hover:bg-rose-100 text-rose-600 p-2 rounded-xl text-xs font-medium transition" title="Eliminar viaje">
              <i class="fa-solid fa-trash-can"></i>
            </button>
          </div>
        </div>

        <!-- Módulo de Presupuesto del Viaje -->
        <div class="mt-4 pt-4 border-t border-slate-100">
          <div class="flex justify-between items-center mb-2">
            <span class="text-xs font-bold text-slate-700 uppercase tracking-wide flex items-center gap-1.5">
              <i class="fa-solid fa-wallet text-indigo-600"></i> Presupuesto & Balance
            </span>
            <button onclick="openBudgetModal()" class="text-[11px] font-bold text-indigo-600 bg-indigo-50 hover:bg-indigo-100 px-2.5 py-1 rounded-lg transition border border-indigo-100 flex items-center gap-1">
              <i class="fa-solid fa-pen text-[10px]"></i> Editar Presupuesto
            </button>
          </div>

          <div class="grid grid-cols-3 gap-2 text-center">
            <div class="bg-slate-50 p-2.5 rounded-xl border border-slate-100">
              <span class="text-[10px] font-bold text-slate-400 uppercase block">Presupuesto</span>
              <p id="budget-total" class="text-sm font-black text-slate-800 mt-0.5">$0.00</p>
            </div>
            <div class="bg-slate-50 p-2.5 rounded-xl border border-slate-100">
              <span class="text-[10px] font-bold text-slate-400 uppercase block">Gastado</span>
              <p id="budget-spent" class="text-sm font-black text-rose-600 mt-0.5">$0.00</p>
            </div>
            <div class="bg-slate-50 p-2.5 rounded-xl border border-slate-100">
              <span class="text-[10px] font-bold text-slate-400 uppercase block">Disponible</span>
              <p id="budget-remaining" class="text-sm font-black text-emerald-600 mt-0.5">$0.00</p>
            </div>
          </div>
        </div>
      </div>

      <!-- Listado de Paradas / Etapas -->
      <div class="flex items-center justify-between">
        <h3 class="text-base font-extrabold text-slate-800 flex items-center gap-2">
          <span>Etapas del Recorrido</span>
          <span id="stage-count" class="text-[10px] font-bold bg-slate-200 text-slate-700 px-2 py-0.5 rounded-full">0</span>
        </h3>
        <button onclick="openStageModal()" class="bg-emerald-600 hover:bg-emerald-700 active:scale-95 text-white px-3 py-1.5 rounded-xl text-xs font-bold shadow-sm transition flex items-center gap-1">
          <i class="fa-solid fa-plus text-[10px]"></i> Nueva Parada
        </button>
      </div>

      <div id="stages-container" class="space-y-4">
        <!-- Paradas renderizadas -->
      </div>
    </section>

  </main>

  <!-- MODAL: CAMBIAR PRESUPUESTO -->
  <div id="modal-budget" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm hidden flex items-center justify-center z-50 p-4">
    <div class="bg-white rounded-2xl max-w-xs w-full p-5 shadow-2xl">
      <h3 class="text-base font-bold text-slate-800 mb-3">Editar Presupuesto Total</h3>
      <form onsubmit="handleSaveBudget(event)" class="space-y-3">
        <div>
          <label class="block text-[10px] font-bold text-slate-500 uppercase mb-1">Monto Total Estimado ($ USD)</label>
          <input type="number" id="input-budget-amount" step="0.01" required placeholder="Ej: 5000" class="w-full px-3 py-2 border border-slate-300 rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
        </div>
        <div class="flex justify-end space-x-2 pt-2">
          <button type="button" onclick="closeBudgetModal()" class="px-3 py-1.5 text-slate-500 text-xs font-semibold">Cancelar</button>
          <button type="submit" class="bg-indigo-600 text-white px-4 py-1.5 rounded-xl text-xs font-bold shadow">Guardar</button>
        </div>
      </form>
    </div>
  </div>

  <!-- MODAL: CREAR / EDITAR VIAJE -->
  <div id="modal-trip" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm hidden flex items-center justify-center z-50 p-4">
    <div class="bg-white rounded-2xl max-w-sm w-full p-5 shadow-2xl">
      <h3 id="modal-trip-title-text" class="text-base font-bold text-slate-800 mb-3">Nuevo Viaje</h3>
      <form id="form-trip" onsubmit="handleSaveTrip(event)" class="space-y-3">
        <input type="hidden" id="edit-trip-id">
        <div>
          <label class="block text-[10px] font-bold text-slate-500 uppercase mb-1">Destino / Nombre</label>
          <input type="text" id="trip-title" required placeholder="Ej: Estados Unidos" class="w-full px-3 py-2 border border-slate-300 rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
        </div>
        <div>
          <label class="block text-[10px] font-bold text-slate-500 uppercase mb-1">Descripción corta</label>
          <input type="text" id="trip-desc" placeholder="Ej: Recorrido de Costa a Costa" class="w-full px-3 py-2 border border-slate-300 rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
        </div>
        <div>
          <label class="block text-[10px] font-bold text-slate-500 uppercase mb-1">Presupuesto ($ USD)</label>
          <input type="number" id="trip-budget" step="0.01" placeholder="Ej: 4500" class="w-full px-3 py-2 border border-slate-300 rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
        </div>
        <div class="flex justify-end space-x-2 pt-2">
          <button type="button" onclick="closeTripModal()" class="px-3 py-1.5 text-slate-500 text-xs font-semibold">Cancelar</button>
          <button type="submit" class="bg-indigo-600 text-white px-4 py-1.5 rounded-xl text-xs font-bold shadow">Guardar</button>
        </div>
      </form>
    </div>
  </div>

  <!-- MODAL: CREAR / EDITAR ETAPA -->
  <div id="modal-stage" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm hidden flex items-center justify-center z-50 p-4">
    <div class="bg-white rounded-2xl max-w-md w-full p-5 shadow-2xl max-h-[90vh] overflow-y-auto">
      <h3 id="modal-stage-title-text" class="text-base font-bold text-slate-800 mb-3">Agregar Parada</h3>
      <form id="form-stage" onsubmit="handleSaveStage(event)" class="space-y-3">
        <input type="hidden" id="edit-stage-id">
        <div>
          <label class="block text-[10px] font-bold text-slate-500 uppercase mb-1">Ciudad / Punto de Parada</label>
          <input type="text" id="stage-name" required placeholder="Ej: Nueva York" class="w-full px-3 py-2 border border-slate-300 rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
        </div>
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block text-[10px] font-bold text-slate-500 uppercase mb-1">Llegada</label>
            <input type="date" id="stage-date-start" class="w-full px-2 py-1.5 border border-slate-300 rounded-xl text-xs focus:ring-2 focus:ring-indigo-500 outline-none">
          </div>
          <div>
            <label class="block text-[10px] font-bold text-slate-500 uppercase mb-1">Salida</label>
            <input type="date" id="stage-date-end" class="w-full px-2 py-1.5 border border-slate-300 rounded-xl text-xs focus:ring-2 focus:ring-indigo-500 outline-none">
          </div>
        </div>
        <div>
          <label class="block text-[10px] font-bold text-slate-500 uppercase mb-1">Hotel / Alojamiento</label>
          <input type="text" id="stage-hotel" placeholder="Ej: DoubleTree Times Square" class="w-full px-3 py-2 border border-slate-300 rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
        </div>
        <div>
          <label class="block text-[10px] font-bold text-slate-500 uppercase mb-1">Puntos a Visitar</label>
          <textarea id="stage-places" rows="2" placeholder="Ej: Rockefeller Center, Central Park..." class="w-full px-3 py-2 border border-slate-300 rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 outline-none"></textarea>
        </div>
        <div>
          <label class="block text-[10px] font-bold text-slate-500 uppercase mb-1">Notas / Consejos</label>
          <input type="text" id="stage-notes" placeholder="Ej: Metro Línea N/Q/R" class="w-full px-3 py-2 border border-slate-300 rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
        </div>
        <div class="flex justify-end space-x-2 pt-2">
          <button type="button" onclick="closeStageModal()" class="px-3 py-1.5 text-slate-500 text-xs font-semibold">Cancelar</button>
          <button type="submit" class="bg-emerald-600 text-white px-4 py-1.5 rounded-xl text-xs font-bold shadow">Guardar Parada</button>
        </div>
      </form>
    </div>
  </div>

  <!-- MODAL: CREAR / EDITAR GASTO -->
  <div id="modal-expense" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm hidden flex items-center justify-center z-50 p-4">
    <div class="bg-white rounded-2xl max-w-xs w-full p-5 shadow-2xl">
      <h3 id="modal-expense-title-text" class="text-base font-bold text-slate-800 mb-3">Registrar Gasto</h3>
      <form id="form-expense" onsubmit="handleSaveExpense(event)" class="space-y-3">
        <input type="hidden" id="expense-stage-id">
        <input type="hidden" id="expense-edit-id">
        <div>
          <label class="block text-[10px] font-bold text-slate-500 uppercase mb-1">Concepto</label>
          <input type="text" id="expense-title" required placeholder="Ej: Cena / Entradas" class="w-full px-3 py-2 border border-slate-300 rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
        </div>
        <div>
          <label class="block text-[10px] font-bold text-slate-500 uppercase mb-1">Monto ($ USD)</label>
          <input type="number" id="expense-amount" step="0.01" required placeholder="Ej: 45.00" class="w-full px-3 py-2 border border-slate-300 rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
        </div>
        <div class="flex justify-end space-x-2 pt-2">
          <button type="button" onclick="closeExpenseModal()" class="px-3 py-1.5 text-slate-500 text-xs font-semibold">Cancelar</button>
          <button type="submit" class="bg-rose-600 text-white px-4 py-1.5 rounded-xl text-xs font-bold shadow">Guardar Gasto</button>
        </div>
      </form>
    </div>
  </div>

  <!-- LOGICA DE LA APLICACION -->
  <script>
    // Estado inicial
    let trips = JSON.parse(localStorage.getItem('diky_trips_v3')) || [
      {
        id: '1',
        title: 'Estados Unidos',
        desc: 'Aventura Costa a Costa',
        budget: 4500,
        stages: [
          { 
            id: 's1', 
            name: 'Miami', 
            dateStart: '2026-08-16', 
            dateEnd: '2026-08-17', 
            hotel: 'Lo de Tati', 
            places: 'Key West, South Beach, Bayside Marketplace', 
            notes: 'Salida en tren Amtrak hacia Nueva York',
            expenses: [{ id: 'e1', title: 'Tren Amtrak', amount: 140 }]
          },
          { 
            id: 's2', 
            name: 'Nueva York', 
            dateStart: '2026-08-18', 
            dateEnd: '2026-08-21', 
            hotel: 'DoubleTree by Hilton Times Square South', 
            places: 'Rockefeller Center, Central Park, Brooklyn Bridge', 
            notes: 'MetroCard 7 días',
            expenses: [{ id: 'e2', title: 'Hotel Reserva', amount: 650 }, { id: 'e3', title: 'Pase Atracciones', amount: 180 }]
          }
        ]
      }
    ];

    let currentTripId = null;

    function saveToStorage() {
      localStorage.setItem('diky_trips_v3', JSON.stringify(trips));
    }

    // Navegación
    function showDashboard() {
      currentTripId = null;
      document.getElementById('view-dashboard').classList.remove('hidden');
      document.getElementById('view-trip-detail').classList.add('hidden');
      document.getElementById('btn-main-dashboard').classList.add('hidden');
      renderTrips();
    }

    function showTripDetail(tripId) {
      currentTripId = tripId;
      document.getElementById('view-dashboard').classList.add('hidden');
      document.getElementById('view-trip-detail').classList.remove('hidden');
      document.getElementById('btn-main-dashboard').classList.remove('hidden');
      renderTripDetail();
    }

    // Renderizado Dashboard
    function renderTrips() {
      const container = document.getElementById('trips-container');
      container.innerHTML = '';

      if (trips.length === 0) {
        container.innerHTML = `<div class="col-span-full text-center py-10 text-slate-400 text-xs">No hay viajes registrados. ¡Crea el primero!</div>`;
        return;
      }

      trips.forEach((trip) => {
        const totalSpent = trip.stages.reduce((acc, s) => acc + (s.expenses ? s.expenses.reduce((ea, e) => ea + parseFloat(e.amount || 0), 0) : 0), 0);
        
        const card = document.createElement('div');
        card.className = "bg-white rounded-2xl p-4 shadow-sm border border-slate-200/80 hover:shadow-md transition flex flex-col justify-between";
        card.innerHTML = `
          <div>
            <div class="flex items-center justify-between mb-2">
              <span class="text-[10px] font-bold text-indigo-600 bg-indigo-50 px-2 py-0.5 rounded-full border border-indigo-100">
                <i class="fa-solid fa-location-dot"></i> ${trip.stages.length} Paradas
              </span>
              <span class="text-[11px] font-extrabold text-slate-600">$${totalSpent.toFixed(2)} gastados</span>
            </div>
            <h3 class="text-lg font-bold text-slate-800">${trip.title}</h3>
            <p class="text-xs text-slate-500 mt-0.5 mb-3">${trip.desc || 'Sin descripción'}</p>
          </div>
          <div class="flex gap-2">
            <button onclick="showTripDetail('${trip.id}')" class="flex-1 bg-slate-900 hover:bg-indigo-600 text-white font-bold py-2 rounded-xl text-xs transition flex items-center justify-center gap-1.5">
              Ver Detalle <i class="fa-solid fa-chevron-right text-[10px]"></i>
            </button>
            <button onclick="openTripModal('${trip.id}')" class="bg-slate-100 hover:bg-amber-100 text-slate-600 hover:text-amber-700 px-3 py-2 rounded-xl text-xs transition" title="Editar Viaje">
              <i class="fa-solid fa-pen"></i>
            </button>
          </div>
        `;
        container.appendChild(card);
      });
    }

    // Renderizado Detalle
    function renderTripDetail() {
      const trip = trips.find(t => t.id === currentTripId);
      if (!trip) return showDashboard();

      document.getElementById('detail-trip-title').innerText = trip.title;
      document.getElementById('detail-trip-desc').innerText = trip.desc || 'Sin descripción';
      document.getElementById('stage-count').innerText = trip.stages.length;

      // CÁLCULO DE PRESUPUESTO Y GASTOS
      const budget = parseFloat(trip.budget || 0);
      let totalSpent = 0;
      trip.stages.forEach(s => {
        if (s.expenses) {
          s.expenses.forEach(e => totalSpent += parseFloat(e.amount || 0));
        }
      });
      const remaining = budget - totalSpent;

      document.getElementById('budget-total').innerText = `$${budget.toFixed(2)}`;
      document.getElementById('budget-spent').innerText = `$${totalSpent.toFixed(2)}`;
      document.getElementById('budget-remaining').innerText = `$${remaining.toFixed(2)}`;
      document.getElementById('budget-remaining').className = `text-sm font-black mt-0.5 ${remaining < 0 ? 'text-rose-600' : 'text-emerald-600'}`;

      // RENDERIZADO DE ETAPAS
      const container = document.getElementById('stages-container');
      container.innerHTML = '';

      if (trip.stages.length === 0) {
        container.innerHTML = `<div class="text-center py-8 bg-white rounded-2xl border border-dashed border-slate-300 text-slate-400 text-xs">No hay paradas en este viaje aún.</div>`;
        return;
      }

      trip.stages.forEach((stage, idx) => {
        const mapsQuery = encodeURIComponent(`${stage.name} ${stage.hotel || ''}`);
        const restaurantQuery = encodeURIComponent(`Restaurantes cerca de ${stage.name}`);
        const metroQuery = encodeURIComponent(`Estación metro cerca de ${stage.name}`);

        const stageExpensesTotal = stage.expenses ? stage.expenses.reduce((sum, e) => sum + parseFloat(e.amount || 0), 0) : 0;

        // Lista HTML de gastos
        let expensesListHtml = '';
        if (stage.expenses && stage.expenses.length > 0) {
          expensesListHtml = stage.expenses.map(exp => `
            <div class="flex items-center justify-between text-xs bg-slate-50 py-1.5 px-2.5 rounded-lg border border-slate-100">
              <span class="font-medium text-slate-700">${exp.title}</span>
              <div class="flex items-center gap-2">
                <span class="font-bold text-slate-900">$${parseFloat(exp.amount).toFixed(2)}</span>
                <button onclick="openExpenseModal('${stage.id}', '${exp.id}')" class="text-amber-600 hover:text-amber-800 p-0.5" title="Editar gasto"><i class="fa-solid fa-pen text-[10px]"></i></button>
                <button onclick="deleteExpense('${stage.id}', '${exp.id}')" class="text-rose-500 hover:text-rose-700 p-0.5" title="Borrar gasto"><i class="fa-solid fa-xmark text-[11px]"></i></button>
              </div>
            </div>
          `).join('');
        } else {
          expensesListHtml = `<p class="text-[11px] text-slate-400 italic">Sin gastos registrados en esta etapa.</p>`;
        }

        const item = document.createElement('div');
        item.className = "bg-white rounded-2xl p-4 shadow-sm border border-slate-200/80 space-y-3";
        item.innerHTML = `
          <div class="flex justify-between items-start gap-2">
            <div class="flex items-center gap-2">
              <span class="w-6 h-6 rounded-full bg-indigo-600 text-white text-[11px] font-black flex items-center justify-center">${idx + 1}</span>
              <h4 class="text-base font-bold text-slate-800">${stage.name}</h4>
              ${stage.dateStart ? `<span class="text-[10px] bg-slate-100 text-slate-600 px-2 py-0.5 rounded-full"><i class="fa-regular fa-calendar"></i> ${stage.dateStart} ${stage.dateEnd ? ' al ' + stage.dateEnd : ''}</span>` : ''}
            </div>
            
            <div class="flex items-center gap-1">
              <button onclick="openStageModal('${stage.id}')" class="text-[11px] bg-amber-50 text-amber-700 hover:bg-amber-100 px-2 py-1 rounded-lg font-bold transition flex items-center gap-1">
                <i class="fa-solid fa-pen"></i> Editar
              </button>
              <button onclick="deleteStage('${stage.id}')" class="text-[11px] bg-rose-50 text-rose-600 hover:bg-rose-100 px-2 py-1 rounded-lg font-bold transition" title="Borrar etapa">
                <i class="fa-solid fa-trash-can"></i>
              </button>
            </div>
          </div>

          <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 text-xs text-slate-600">
            <div class="space-y-1.5">
              ${stage.hotel ? `<p><i class="fa-solid fa-hotel text-indigo-500 w-4"></i> <strong>Hotel:</strong> ${stage.hotel}</p>` : ''}
              ${stage.places ? `<p><i class="fa-solid fa-map-pin text-rose-500 w-4"></i> <strong>Atracciones:</strong> ${stage.places}</p>` : ''}
              ${stage.notes ? `<p class="italic text-slate-500"><i class="fa-solid fa-note-sticky text-amber-500 w-4"></i> ${stage.notes}</p>` : ''}
            </div>

            <!-- Accesos Inteligentes a Google Maps -->
            <div class="bg-slate-50 p-2.5 rounded-xl border border-slate-100 space-y-1.5">
              <span class="text-[10px] font-bold text-slate-400 uppercase block"><i class="fa-solid fa-compass text-indigo-600"></i> Google Maps</span>
              <div class="flex flex-wrap gap-1.5">
                <a href="https://www.google.com/maps/search/?api=1&query=${mapsQuery}" target="_blank" class="text-[10px] bg-white border border-slate-200 hover:bg-indigo-50 hover:text-indigo-600 px-2 py-1 rounded-lg transition font-semibold flex items-center gap-1">
                  <i class="fa-solid fa-map-location-dot text-rose-500"></i> Ubicación
                </a>
                <a href="https://www.google.com/maps/search/?api=1&query=${restaurantQuery}" target="_blank" class="text-[10px] bg-white border border-slate-200 hover:bg-indigo-50 hover:text-indigo-600 px-2 py-1 rounded-lg transition font-semibold flex items-center gap-1">
                  <i class="fa-solid fa-utensils text-emerald-500"></i> Comida
                </a>
                <a href="https://www.google.com/maps/search/?api=1&query=${metroQuery}" target="_blank" class="text-[10px] bg-white border border-slate-200 hover:bg-indigo-50 hover:text-indigo-600 px-2 py-1 rounded-lg transition font-semibold flex items-center gap-1">
                  <i class="fa-solid fa-train-subway text-indigo-500"></i> Metro
                </a>
              </div>
            </div>
          </div>

          <!-- Módulo de Gastos de la Etapa -->
          <div class="pt-2.5 border-t border-slate-100 space-y-2">
            <div class="flex justify-between items-center">
              <span class="text-xs font-bold text-slate-700">Gastos en esta parada: <span class="text-slate-900">$${stageExpensesTotal.toFixed(2)}</span></span>
              <button onclick="openExpenseModal('${stage.id}')" class="text-[10px] bg-emerald-50 text-emerald-700 hover:bg-emerald-100 px-2 py-1 rounded-lg font-bold transition flex items-center gap-1 border border-emerald-100">
                <i class="fa-solid fa-plus"></i> Cargar Gasto
              </button>
            </div>
            <div class="space-y-1">
              ${expensesListHtml}
            </div>
          </div>
        `;
        container.appendChild(item);
      });
    }

    // GESTIÓN DE PRESUPUESTO
    function openBudgetModal() {
      const trip = trips.find(t => t.id === currentTripId);
      if (!trip) return;
      document.getElementById('input-budget-amount').value = trip.budget || '';
      document.getElementById('modal-budget').classList.remove('hidden');
    }
    function closeBudgetModal() { document.getElementById('modal-budget').classList.add('hidden'); }

    function handleSaveBudget(e) {
      e.preventDefault();
      const trip = trips.find(t => t.id === currentTripId);
      if (trip) {
        trip.budget = parseFloat(document.getElementById('input-budget-amount').value || 0);
        saveToStorage();
        closeBudgetModal();
        renderTripDetail();
      }
    }

    // GESTIÓN DE VIAJES
    function openTripModal(tripId = null) {
      document.getElementById('modal-trip').classList.remove('hidden');
      if (tripId) {
        const trip = trips.find(t => t.id === tripId);
        document.getElementById('modal-trip-title-text').innerText = "Editar Viaje";
        document.getElementById('edit-trip-id').value = trip.id;
        document.getElementById('trip-title').value = trip.title;
        document.getElementById('trip-desc').value = trip.desc || '';
        document.getElementById('trip-budget').value = trip.budget || '';
      } else {
        document.getElementById('modal-trip-title-text').innerText = "Nuevo Viaje";
        document.getElementById('form-trip').reset();
        document.getElementById('edit-trip-id').value = '';
      }
    }
    function closeTripModal() { document.getElementById('modal-trip').classList.add('hidden'); }

    function handleSaveTrip(e) {
      e.preventDefault();
      const editId = document.getElementById('edit-trip-id').value;
      const title = document.getElementById('trip-title').value;
      const desc = document.getElementById('trip-desc').value;
      const budget = parseFloat(document.getElementById('trip-budget').value || 0);

      if (editId) {
        const trip = trips.find(t => t.id === editId);
        if (trip) {
          trip.title = title;
          trip.desc = desc;
          trip.budget = budget;
        }
      } else {
        trips.push({ id: Date.now().toString(), title, desc, budget, stages: [] });
      }

      saveToStorage();
      closeTripModal();
      if (currentTripId) renderTripDetail(); else renderTrips();
    }

    function editCurrentTrip() { openTripModal(currentTripId); }

    function deleteCurrentTrip() {
      if (confirm('¿Eliminar este viaje y todas sus etapas?')) {
        trips = trips.filter(t => t.id !== currentTripId);
        saveToStorage();
        showDashboard();
      }
    }

    // GESTIÓN DE ETAPAS
    function openStageModal(stageId = null) {
      document.getElementById('modal-stage').classList.remove('hidden');
      const trip = trips.find(t => t.id === currentTripId);

      if (stageId && trip) {
        const stage = trip.stages.find(s => s.id === stageId);
        document.getElementById('modal-stage-title-text').innerText = "Editar Parada";
        document.getElementById('edit-stage-id').value = stage.id;
        document.getElementById('stage-name').value = stage.name;
        document.getElementById('stage-date-start').value = stage.dateStart || '';
        document.getElementById('stage-date-end').value = stage.dateEnd || '';
        document.getElementById('stage-hotel').value = stage.hotel || '';
        document.getElementById('stage-places').value = stage.places || '';
        document.getElementById('stage-notes').value = stage.notes || '';
      } else {
        document.getElementById('modal-stage-title-text').innerText = "Agregar Nueva Parada";
        document.getElementById('form-stage').reset();
        document.getElementById('edit-stage-id').value = '';
      }
    }
    function closeStageModal() { document.getElementById('modal-stage').classList.add('hidden'); }

    function handleSaveStage(e) {
      e.preventDefault();
      const trip = trips.find(t => t.id === currentTripId);
      if (!trip) return;

      const editStageId = document.getElementById('edit-stage-id').value;
      const stageData = {
        name: document.getElementById('stage-name').value,
        dateStart: document.getElementById('stage-date-start').value,
        dateEnd: document.getElementById('stage-date-end').value,
        hotel: document.getElementById('stage-hotel').value,
        places: document.getElementById('stage-places').value,
        notes: document.getElementById('stage-notes').value
      };

      if (editStageId) {
        const stage = trip.stages.find(s => s.id === editStageId);
        if (stage) Object.assign(stage, stageData);
      } else {
        trip.stages.push({ id: Date.now().toString(), ...stageData, expenses: [] });
      }

      saveToStorage();
      closeStageModal();
      renderTripDetail();
    }

    function deleteStage(stageId) {
      const trip = trips.find(t => t.id === currentTripId);
      if (trip && confirm('¿Eliminar esta parada?')) {
        trip.stages = trip.stages.filter(s => s.id !== stageId);
        saveToStorage();
        renderTripDetail();
      }
    }

    // GESTIÓN DE GASTOS (Crear, Editar y Borrar)
    function openExpenseModal(stageId, expenseId = null) {
      const trip = trips.find(t => t.id === currentTripId);
      if (!trip) return;
      const stage = trip.stages.find(s => s.id === stageId);
      if (!stage) return;

      document.getElementById('modal-expense').classList.remove('hidden');
      document.getElementById('expense-stage-id').value = stageId;

      if (expenseId && stage.expenses) {
        const exp = stage.expenses.find(e => e.id === expenseId);
        document.getElementById('modal-expense-title-text').innerText = "Editar Gasto";
        document.getElementById('expense-edit-id').value = exp.id;
        document.getElementById('expense-title').value = exp.title;
        document.getElementById('expense-amount').value = exp.amount;
      } else {
        document.getElementById('modal-expense-title-text').innerText = "Registrar Gasto";
        document.getElementById('form-expense').reset();
        document.getElementById('expense-edit-id').value = '';
      }
    }
    function closeExpenseModal() { document.getElementById('modal-expense').classList.add('hidden'); }

    function handleSaveExpense(e) {
      e.preventDefault();
      const stageId = document.getElementById('expense-stage-id').value;
      const editExpenseId = document.getElementById('expense-edit-id').value;
      const trip = trips.find(t => t.id === currentTripId);
      if (!trip) return;

      const stage = trip.stages.find(s => s.id === stageId);
      if (stage) {
        if (!stage.expenses) stage.expenses = [];

        const title = document.getElementById('expense-title').value;
        const amount = parseFloat(document.getElementById('expense-amount').value || 0);

        if (editExpenseId) {
          const exp = stage.expenses.find(e => e.id === editExpenseId);
          if (exp) {
            exp.title = title;
            exp.amount = amount;
          }
        } else {
          stage.expenses.push({
            id: Date.now().toString(),
            title,
            amount
          });
        }

        saveToStorage();
        closeExpenseModal();
        renderTripDetail();
      }
    }

    function deleteExpense(stageId, expenseId) {
      const trip = trips.find(t => t.id === currentTripId);
      if (!trip) return;
      const stage = trip.stages.find(s => s.id === stageId);
      if (stage && stage.expenses && confirm('¿Eliminar este gasto?')) {
        stage.expenses = stage.expenses.filter(e => e.id !== expenseId);
        saveToStorage();
        renderTripDetail();
      }
    }

    // Inicialización
    renderTrips();
  </script>
</body>
</html>
